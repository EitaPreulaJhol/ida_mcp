[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ida_mcp"
description = "Expose a running IDA Pro session to AI coding agents over the Model Context Protocol (MCP)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "EitaPreulaJhol", email = "carlos.pdesanti@gmail.com" }]
keywords = ["ida", "ida-pro", "mcp", "reverse-engineering", "decompiler", "hex-rays"]
requires-python = ">=3.11"
# Runtime has ZERO third-party dependencies: the MCP transport is vendored in
# ida_mcp/zeromcp on top of the stdlib. IDA Pro (8.3+) provides the idaapi /
# ida_* / idc / idautils modules at runtime; they are not installable via pip.
dependencies = []
dynamic = ["version"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
]

[project.urls]
Homepage = "https://github.com/EitaPreulaJhol/ida_mcp"
Repository = "https://github.com/EitaPreulaJhol/ida_mcp.git"

[project.optional-dependencies]
# Dev-only tooling. Never imported at runtime, so the zero-dependency runtime
# promise holds: `pip install ida_mcp[dev]` only for linting/CI.
dev = ["ruff>=0.17", "mypy>=1.0", "coverage>=7"]

[tool.setuptools]
# The plugin is loaded by IDA from the source tree; packaging metadata only.
packages = ["ida_mcp", "ida_mcp.zeromcp"]

[tool.setuptools.package-data]
# A pip-installed wheel must carry the profile allowlists: without them
# get_profile() returns None for every name and ?profile= silently means
# "no filter" (186 tools instead of the documented triage set).
ida_mcp = ["profiles/*.txt"]

[tool.setuptools.dynamic]
version = { attr = "ida_mcp.__version__" }

[tool.ruff]
# IDA ships Python 3.11; match it so ruff doesn't flag 3.12+ idioms.
target-version = "py311"
line-length = 100
# Vendored transport and bytecode caches are not ours to lint.
extend-exclude = ["ida_mcp/zeromcp", "__pycache__", "strix_runs"]

[tool.ruff.lint]
# Enforced: pyflakes (F: unused imports, undefined names, f-string and
# redefinition bugs) + pycodestyle errors/warnings (E, W: bare except, None
# comparisons, invalid escapes...) + flake8-comprehensions (C4) +
# flake8-bugbear (B: explicit exception causes, closures over loop variables,
# mutable defaults...). All high signal and zero findings on the tree.
#
# Deliberately NOT enabled (counted with ruff 0.17.4, the version CI pins):
# - I:  70x I001, import-order churn -- and `ida_mcp/__init__.py` has a
#       load-bearing, documented import order (rpc/sync before the rest) that
#       isort would invert.
# - UP: 19 (UP015 x7, UP031 x4, UP041 x2, UP017, UP039, UP045, UP036),
#       restyling with no behavioral gain; UP036's "fix" would delete a version
#       guard that documents 3.11-only regex syntax.
select = ["F", "E", "W", "C4", "B"]
ignore = [
    "E501",  # line length is enforced softly; long docstrings/URLs are fine
    "E741",  # ambiguous names (l, O) show up in short RE/loop locals
]

[tool.ruff.lint.per-file-ignores]
# Tests stub IDA modules and exec sources; star/unused patterns are expected.
"tests/*" = ["E402", "F401", "F403", "F405", "B011"]
# Re-exports: __init__ intentionally imports names for the public surface.
"ida_mcp/__init__.py" = ["F401"]

[tool.mypy]
# Type-check only the IDA-INDEPENDENT pure modules (the rest import idaapi and
# would need SDK stubs). Lenient on purpose: a bug net, not full strictness.
# Verified clean (mypy 1.0.1), so the CI job is a real gate.
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = false
# Resolving these modules pulls in the ida_mcp package __init__ (which imports
# the IDA-touching tool modules). follow_imports=silent analyses them for types
# but suppresses their errors, so only the listed pure modules are reported.
follow_imports = "silent"
files = [
    "ida_mcp/zeromcp",
    "ida_mcp/discovery.py",
    "ida_mcp/profiles.py",
    "ida_mcp/regex_guard.py",
]

[tool.coverage.run]
# Subprocess harnesses (run_all spawns each) need parallel mode + the
# COVERAGE_PROCESS_START hook to aggregate. Harnesses load the real files via
# tests/_harness.py, so lines are attributed correctly (~68% today; it read
# ~10% while harnesses exec'd rewritten source). Informational (no threshold).
branch = true
parallel = true
source = ["ida_mcp"]
omit = ["ida_mcp/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Floor for `coverage report` (CI + `make coverage`). Measured 66% by the v0.2.1
# CI run (42 harnesses, subprocess aggregation); 60 leaves headroom for an
# unrelated refactor while still catching a real regression. Re-measure with
# `make coverage` before raising it.
fail_under = 60
