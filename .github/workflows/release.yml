name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # Gate the release on a green suite (dependency-free, IDA stubbed).
      - name: Run test suite
        run: python tests/run_all.py
      # Refuse to publish e.g. tag v0.2.0 as ida_mcp-0.1.0.zip.
      - name: Build plugin zip (tag must match __version__)
        run: python scripts/package.py --expect-version "${GITHUB_REF_NAME#v}"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/ida_mcp-*.zip
          generate_release_notes: true
