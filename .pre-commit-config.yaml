# Opt-in local hooks: `pip install pre-commit && pre-commit install`.
# Mirrors CI (ruff with the pyproject rule set) plus the dependency-free drift guard, so you
# catch issues before pushing. Runtime stays dependency-free.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      - id: tool-inventory
        name: tool inventory drift guard
        entry: python3 tests/tool_inventory_test.py
        language: system
        pass_filenames: false
        always_run: true
